name = "mimu-mutual-api-staging"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

# Per-IP / per-player rate limits (Cloudflare Workers Rate Limiting). limit = requests per period seconds.
[[ratelimits]]
name = "RL_AUTH"          # sign-in: nonce + auth, per IP
namespace_id = "2001"
simple = { limit = 60, period = 60 }   # same as production, so the long test suite is not throttled

[[ratelimits]]
name = "RL_RUN"           # starting runs and uploading run chunks, per player
namespace_id = "2002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_READ"          # leaderboard reads, per IP
namespace_id = "2003"
simple = { limit = 120, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "mimu-mutual-staging"
database_id = "43749af3-bb92-4b23-ad47-7cd8be61ac9f"

[vars]
ALLOWED_ORIGINS = "https://mutualmimu.fun,https://www.mutualmimu.fun,http://localhost:8765"

# Holdings rules. Format "chainId:0xContract" (ERC-721) or "chainId:0xContract:tokenId" (ERC-1155).
# Leave empty until the contracts are known: an empty rule is simply not enforced.
GATE_MIMU  = ""   # Mimu On Ape (ApeChain, ERC-721): must HOLD one to play
GATE_PASS  = ""   # TMF Pass (Robinhood Chain, ERC-721): holding one BLOCKS play
GATE_DENGS = ""   # Dengs (ApeChain, ERC-721): holding one BLOCKS play

# Public RPC per chain id used for the holdings checks (swap for your own provider key if you like).
RPC_33139 = "https://apechain.calderachain.xyz/http"
RPC_1     = "https://cloudflare-eth.com"
RPC_4663  = "https://robinhood-rpc.publicnode.com,https://robinhood.drpc.org,https://4663.rpc.thirdweb.com,https://rpc.mainnet.chain.robinhood.com"   # several = automatic fallback
EXPLORER_4663 = "https://robinhoodchain.blockscout.com"   # keyless fallback if every RPC is busy
DONATE_FROM = "0"            # staging: gifts always open so the tests can run
DONATE_UNTIL = "99999999999999"
CHAIR_RUN_OPEN = "1"          # staging: always open so the tests can run
X_REQUIRED = "1"   # every player must add an X handle (typed until real X login is set up)

# test server only: judge timing after 8 inputs instead of 40 so the hold/release flow can be tested quickly
BOT_MIN = "8"
